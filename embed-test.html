<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTok embed test</title>
<style>
:root { --bg: #0b0f14; --fg: #f3f5f7; --muted: #9aa7b4; --accent: #39c0ff; --ok: #2ecc71; --bad: #ff5c5c; --card: #151b22; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--fg); font: 17px/1.4 -apple-system, system-ui, sans-serif; }
[hidden] { display: none !important; }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; background: linear-gradient(var(--bg), transparent); }
#filters button, #gear { background: none; border: 0; color: var(--muted); font: inherit; padding: 6px 10px; }
#filters button.on { color: var(--fg); font-weight: 700; border-bottom: 2px solid var(--fg); }
#feed { height: 100vh; height: 100dvh; overflow-y: scroll; overscroll-behavior: contain; scroll-snap-type: y mandatory; }
.clip { height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; flex-direction: column; justify-content: center; padding: calc(env(safe-area-inset-top) + 72px) 24px calc(env(safe-area-inset-bottom) + 48px); }
.teach { cursor: pointer; }
.teach:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.teach .frames { position: relative; flex: 1; }
.frame { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; opacity: 0; transform: translateY(16px); transition: opacity .35s, transform .35s; }
.frame.on { opacity: 1; transform: none; }
.big { font-size: clamp(28px, 8vw, 44px); font-weight: 800; line-height: 1.15; margin: 0 0 16px; }
.src { color: var(--muted); font-size: 13px; }
.bar { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom); height: 3px; background: #ffffff22; }
.fill { height: 100%; width: 0; background: var(--accent); }
.paused { position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; color: #ffffffaa; pointer-events: none; }
.paused.retry { inset: auto 20px calc(env(safe-area-inset-bottom) + 16px) auto; font-size: 28px; color: #ffffff88; }
.check { background: var(--card); }
/* Centered when it fits; scrolls inside the card (top stays reachable) when the explanation is long. */
.check .body { min-height: 0; margin: auto 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.kicker { color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 13px; letter-spacing: .08em; }
.q { font-size: 22px; font-weight: 700; }
.opts { display: grid; gap: 10px; }
.opts button { text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid #ffffff22; background: #ffffff0d; color: var(--fg); font: inherit; }
.opts button.right { border-color: var(--ok); background: #2ecc7133; }
.opts button.wrong { border-color: var(--bad); background: #ff5c5c33; }
.opts button:disabled { opacity: 1; }
.mark { font-weight: 800; }
.right .mark { color: var(--ok); }
.wrong .mark { color: var(--bad); }
.why { margin-top: 16px; }
#gate { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; text-align: center; background: var(--bg); padding: 16px; }
#gate button, #settings button { padding: 14px 32px; border-radius: 999px; border: 0; background: var(--accent); color: #001018; font: 700 18px system-ui; }
#settings { position: fixed; top: 56px; right: 16px; left: 16px; z-index: 6; background: var(--card); border-radius: 16px; padding: 16px; }
#settings label { display: block; margin: 8px 0; }
.empty { margin: 0; padding: 120px 24px; color: var(--muted); scroll-snap-align: start; min-height: 100vh; min-height: 100dvh; }
.notice { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 20; padding: 10px 14px; border-radius: 12px; background: var(--card); color: var(--fg); font-size: 14px; box-shadow: 0 4px 16px #0008; }
/* Video details can scroll within a card, keeping long conflict lists reachable. */
.video .body { min-height: 0; margin: auto 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.video h2 { font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
.video-badge { display: inline-block; margin: 0; padding: 6px 10px; border-radius: 12px; font-size: 14px; background: #2ecc7122; color: var(--ok); }
.video-badge.conflict { background: #ff5c5c22; color: var(--fg); }
.video-conflicts { padding-left: 20px; font-size: 14px; overflow-wrap: anywhere; }
.video-conflicts li { margin-bottom: 10px; }
.video-media { width: min(100%, 33.75vh); width: min(100%, 33.75dvh); margin: 0 auto; }
.video.youtube .video-media { width: 100%; }
.video .poster, .video iframe { width: 100%; aspect-ratio: 9 / 16; border: 0; border-radius: 12px; }
.video.youtube .poster, .video.youtube iframe { aspect-ratio: 16 / 9; }
.video .poster { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--card); }
.video.tiktok .poster { background: #153a3e; }
.video.instagram .poster { background: #492342; }
.video.facebook .poster { background: #193960; }
.video .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video iframe { display: block; background: var(--card); }
.video-play { position: relative; width: 72px; height: 72px; border: 0; border-radius: 50%; background: var(--accent); color: var(--bg); font-size: 36px; cursor: pointer; }
.video-skip { display: block; min-height: 44px; margin-top: 8px; padding: 8px 4px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer; }
.video-status { color: var(--muted); font-size: 14px; }
.video button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

</style>
<style>
  body { overflow: auto; height: auto; }
  .note { padding: 16px; color: var(--muted); font-size: 14px; }
  .clip { height: auto; min-height: 0; padding: 16px; border-bottom: 1px solid #ffffff22; }
  h1 { padding: 16px 16px 0; margin: 0; font-size: 22px; }
</style>
</head>
<body>
<h1>Embed test — not study content</h1>
<p class="note">These 4 videos were NOT approved for studying (they failed fact-checking). This page only tests whether each platform's player works on your iPhone. Tap ▶ on each and note: plays? sound? stays inside the page?</p>
<div id="cards"></div>
<script type="module">
import { render } from './js/video.js';
const base = { type: 'video', duration: 60, topics: [], badge: 'ok', checked: 0, total: 0, conflicts: [] };
const clips = [
  { ...base, id: 'v-yt-ADa2iEEb5Ww', platform: 'youtube', embed: 'ADa2iEEb5Ww', url: 'https://www.youtube.com/watch?v=ADa2iEEb5Ww', creator: 'Lung Health', title: '1 · YouTube test' },
  { ...base, id: 'v-tt-7421718332522368302', platform: 'tiktok', embed: '7421718332522368302', url: 'https://www.tiktok.com/@leveluprn/video/7421718332522368302', creator: 'Level Up RN', title: '2 · TikTok test' },
  { ...base, id: 'v-ig-DewiiMblZKw', platform: 'instagram', embed: 'DewiiMblZKw', url: 'https://www.instagram.com/reel/DewiiMblZKw/', creator: 'Respiratory Therapy Zone', title: '3 · Instagram test' },
  { ...base, id: 'v-fb-1809072270432798', platform: 'facebook', embed: '1809072270432798', url: 'https://www.facebook.com/reel/1809072270432798/', creator: 'Respiratory Therapy Zone', title: '4 · Facebook test' },
];
const box = document.getElementById('cards');
for (const c of clips) {
  const v = render(c, { sources: {}, onHideVideo() {} });
  v.el.querySelector('.video-badge').textContent = 'TEST ONLY — not fact-checked';
  v.el.querySelector('.src').textContent = '';
  box.appendChild(v.el);
}
</script>
</body>
</html>
