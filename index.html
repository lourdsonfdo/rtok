<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>RTok</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div id="filters"></div>
    <button id="gear" aria-label="Settings">⚙</button>
  </header>
  <div id="settings" hidden>
    <h2>Exam dates</h2>
    <div id="exams"></div>
    <h2>Progress</h2>
    <button id="backup">Download backup</button>
    <label class="file">Restore backup <input id="restore" type="file" accept="application/json,.json"></label>
  </div>
  <main id="feed"></main>
  <main id="videos" hidden></main>
  <nav id="tabs" hidden>
    <button data-tab="feed" class="on" aria-pressed="true">Feed</button>
    <button data-tab="videos" aria-pressed="false">Videos</button>
  </nav>
  <div id="gate"><h1>RTok</h1><p>Respiratory therapy, one swipe at a time.</p><button id="start">Start</button></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
